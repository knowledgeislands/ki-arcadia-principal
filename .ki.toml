# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-arcadia-principal"
title = "Arcadia Principal"
description = "The core knowledge repository of the Knowledge Islands project — governance base, evolving KB, and decision record."
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"
license = "MIT"
repo_type = "kb"
primary_shape = "ki-repo-kb"
repo_code = "KI-ARCADIA"
store_roles = ["notes"]

[skills.ki-authoring]
[skills.ki-binding]
[skills.ki-binding-claude]
[skills.ki-binding-chatgpt]
[skills.ki-housekeeping-chatgpt]
auto_memory = "disabled"

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-kb]

[skills.ki-repo-kb-streams]
process_note = "Admin/Operations/Processes/Enactment Process"

[skills.ki-repo-kb-activities]

[skills.ki-repo-kb-live-artifacts]

[skills.ki-repo-kb-principal]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]
