[skills.ki-trades]
map_bonus = 1

[skills.ki-trades.territory.subtypes]
public-source-change = "Already-public committed KI source changes for documentation provenance review. Excludes unpublished or confidential material; grants no publication or deployment authority."
shared-capability-maintenance = "Non-sensitive findings about receiver-owned KI skills and governance: defects, compatibility, convention gaps and method outcomes. Excludes acquired user data, business content and credentials; grants no execution authority."
techne-architecture-context = "Approved Techne roles, architectural constraints and decision criteria relevant to the receiver. Grants no new implementation scope, priority, deployment or acceptance authority."
techne-interface-compatibility = "Committed Techne interface and compatibility evidence for receiver-owned components. Excludes credentials and private runtime state; grants no implementation, deployment or release authority."

