# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-arcadia-principal"
title = "Arcadia Principal"
description = "The core knowledge repository of the Knowledge Islands project — governance base, evolving KB, and decision record."
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"
license = "MIT"
repo_type = "kb"
primary_shape = "ki-repo-kb"
repo_code = "KI-ARCADIA"
store_roles = ["notes"]

[skills.ki-authoring]
[skills.ki-binding]
[skills.ki-binding-claude]
[skills.ki-binding-chatgpt]
[skills.ki-housekeeping-chatgpt]
auto_memory = "disabled"

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-kb]

[skills.ki-repo-kb-streams]
process_note = "Admin/Operations/Processes/Enactment Process"

[skills.ki-repo-kb-activities]

[skills.ki-repo-kb-live-artifacts]

[skills.ki-repo-kb-principal]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]
scope = "KI-ARCADIA"

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-agent-coordination-paperclip]
organisation_code = "KIS"

[skills.ki-git]

[skills.ki-work]
adapter = "kb-streams"

[skills.ki-tokenomics]
headroom = "recommended"
preferred_model_type = "standard"
budgets.mcp_servers = 20 # User-scoped; revisit if the global MCP set is pruned.

[skills.ki-housekeeping-claude]
auto_memory = "transition"

[skills.ki-acquire-granola]
folder_ids = ["2454f927-221b-4905-8583-a2daa85af625"]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-chatgpt]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
map_bonus = 1

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
export = ["work", "knowledge"]
import = ["knowledge"]
standing.export.knowledge = ["shared-capability-maintenance"]

[skills.ki-trades.routes."knowledgeislands/ki-specifications"]
export = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-techne-principal"]
export = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-website"]
export = ["knowledge"]
standing.export.knowledge = ["public-source-change"]

