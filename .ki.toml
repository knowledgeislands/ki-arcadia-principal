# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
map_bonus = 1
routes."knowledgeislands/ki-specifications" = { export = ["knowledge"] }
routes."knowledgeislands/ki-techne-principal" = { export = ["knowledge"] }

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
